name: Deploy Game Server to sdk.labb32

on:
    push:
        branches:
            - develop
            - 'feature/Server/**'

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            
            # 1. Export Branch Name
            - name: Set Branch Name
              run: echo "BRANCH_NAME=$(echo ${GITHUB_REF#refs/heads/} | sed 's/\//-/g')" >> $GITHUB_ENV

            # 2. GHCR Login
            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN}}
            
            # 3. Build Image and Push
            - name: Build and Push
              uses: docker/build-push-action@v5
              with:
                context: .
                file: ./Server/Dockerfile
                push: true
                tags: ghcr.io${{ github.repository }}/taxi-server:${{ env.BRANCH_NAME }}
            
            # 4. Connect to Self-Host and run 
            - name: SSH Remote Deploy
              uses: appleboy/ssh-action@v1.0.3
              with:
                host: ${{ secrets.SERVER_IP }}
                username: ${{ secrets.SERVER_USER }}
                key: ${{ secrets.SERVER_SSH_KEY }}
                script: |
                    # server deploy shell script
                    /home/${{ secrets.SERVER_USER }}/deploy.sh ${{ env.BRANCH_NAME }}
